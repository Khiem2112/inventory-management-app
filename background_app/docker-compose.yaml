version: '3.8'

services:
  # RabbitMQ: The Message Broker for Celery
  rabbitmq:
    image: rabbitmq:3-management
    container_name: inventory_rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI (User: guest, Pass: guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - inventory_network

  # MinIO: Local S3-Compatible Object Storage
  minio:
    image: minio/minio
    container_name: inventory_minio
    ports:
      - "9000:9000"   # S3 API port
      - "9001:9001"   # Web Console port
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - inventory_network

networks:
  inventory_network:
    driver: bridge

volumes:
  rabbitmq_data:
  minio_data: